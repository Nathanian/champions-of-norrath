name: Verify functions

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-functions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Recompile PS2 functions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install -r tools/requirements-verify.txt
      - name: Test verifier
        run: python -m unittest discover -s tests -v
      - name: Compile changed functions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/verify_functions.py --base "$BASE_SHA" --install-toolchains
      - name: Compile all functions
        if: github.event_name == 'workflow_dispatch'
        run: python tools/verify_functions.py --install-toolchains
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: function-verification
          path: |
            build/verification.md
            build/verification.json
          if-no-files-found: warn
