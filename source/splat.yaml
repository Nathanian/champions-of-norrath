# name: Your game name here!
sha1: 9d3925b2cc7d46c7344a0f34c295df00629556fd
options:
  disassemble_all: True
  auto_decompile_empty_functions: False
  basename: game.elf
  target_path: game.elf.rom
  elf_path: build/game.elf.elf
  base_path: .
  platform: ps2
  compiler: EEGCC

  gp_value: 0x004879F0
  ld_gp_expression: cod_LIT4_START + 0x7FF0

  # asm_path: asm
  # src_path: src
  # build_path: build

  ld_script_path: game.elf.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True

  create_asm_dependencies: True

  find_file_boundaries: False

  o_as_suffix: True

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    # - .vutext
    # - .ctors
    # - .dtors
    - .data
    # - .eh_frame
    - .rodata
    - .gcc_except_table
    - .lit4
    - .sdata
    - .sbss
    - .bss
    # - .srsctors
    # - .srsdtors
    # - .srs
    # - .loadScreenSection

  auto_link_sections:
    # - .ctors
    # - .dtors
    - .data
    # - .eh_frame
    - .rodata
    - .gcc_except_table
    - .lit4
    - .sdata
    - .sbss
    - .bss
    # - .srsctors
    # - .srsdtors
    # - .srs
    # - .loadScreenSection

segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0x464310
    subalign: null
    subsegments:
      - [0x000000, c, cod]
      - [0x21B510, textbin, cod/21B510] # .vutext
      - [0x21F250, data, cod/21F250] # .ctors
      - [0x21F3EC, data, cod/21F3EC] # .dtors
      - [0x21F480, data, cod/21F480] # .data
      - [0x353970, data, cod/353970] # .eh_frame
      - [0x354300, rodata, cod/354300] # .rodata
      - [0x37F800, gcc_except_table, cod/37F800] # .gcc_except_table
      - [0x37FA00, lit4, cod/37FA00] # .lit4
      - [0x383200, sdata, cod/383200] # .sdata
      - { type: sbss, vram: 0x00486800, name: cod/00486800 } # .sbss
      - { type: bss, vram: 0x00486E00, name: cod/00486E00 } # .bss

  - name: srsctors
    type: code
    start: 0x386B1C
    vram: 0x008EAB1C
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x386B1C, data, srsctors/386B1C] # .srsctors

  - name: srsdtors
    type: code
    start: 0x387B58
    vram: 0x008EAB58
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x387B58, data, srsdtors/387B58] # .srsdtors

  - name: COMMON
    type: code
    start: 0x387B78
    vram: 0x008EAB78
    bss_size: 0x1DA4
    subalign: null
    subsegments:
      - { type: bss, vram: 0x008EAB78, name: COMMON/008EAB78 } # COMMON

  - name: srs
    type: code
    start: 0x388000
    vram: 0x01000000
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x388000, c, srs]

  - name: loadScreenSection
    type: code
    start: 0x6E2000
    vram: 0x01E00000
    bss_size: 0x0
    subalign: null
    subsegments:
      - [0x6E2000, data, loadScreenSection/6E2000] # .loadScreenSection
  - [0x7FA200]
